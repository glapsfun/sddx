name: release smoke test

# Required check on release-please's release PR. This is the automated
# replacement for docs/RELEASING.md's former "blocking (manual)" clean-machine
# install smoke test: a GitHub Actions runner is a clean machine on every run,
# so the check that used to depend on a maintainer remembering to run it by
# hand becomes a merge-blocking required status check instead.
#
# It exercises the artifact a user actually receives — the packed tarball,
# installed globally into an empty prefix — and drives the canonical run
# lifecycle with it. The repository checkout is only the source of the pack;
# nothing below runs sddx out of the working tree.
on:
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: release smoke test
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: pack the release candidate and install it into a clean prefix
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/global"
          npm install --prefix "$RUNNER_TEMP/global" --global "$PWD/$tarball"
          echo "$RUNNER_TEMP/global/bin" >> "$GITHUB_PATH"

      - name: the installed package reports the version being released
        run: |
          set -euo pipefail
          installed="$(sddx --version)"
          expected="$(node -p 'require("./package.json").version')"
          echo "installed=$installed expected=$expected"
          [ "$installed" = "$expected" ] || {
            echo "the packed CLI reports $installed but this release is $expected" >&2
            exit 1
          }

      - name: clean-machine lifecycle (spec -> plan -> task -> verify -> review -> audit)
        run: sh scripts/smoke.sh

      - name: the tarball ships what the distribution model promises
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/global/lib/node_modules/@glapsfun/sddx"
          for required in bin/sddx bin/sddx-run dist/cli.mjs; do
            [ -e "$pkg/$required" ] || { echo "missing from the tarball: $required" >&2; exit 1; }
          done
          for forbidden in .claude-plugin templates dist/bootstrap.mjs dist/hooks.mjs openspec tests; do
            [ ! -e "$pkg/$forbidden" ] || { echo "should not ship: $forbidden" >&2; exit 1; }
          done
          # Bun is the only supported runtime, and nothing may claim otherwise.
          ! grep -rqiE "fall ?back to node|bun-or-node" "$pkg" || {
            echo "the package claims a Node fallback" >&2; exit 1
          }
