name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/pipx/venvs/pre-commit
            ~/.local/bin/pre-commit
          key: ${{ runner.os }}-pipx-pre-commit
      - run: pipx install pre-commit
      # Commit-stage hooks only; typecheck/test/build stay in the verify/test jobs.
      - run: pre-commit run --all-files --show-diff-on-failure

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: dist drift check
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "dist/ is out of sync with src/ — run 'bun run build' and commit the result" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # the plugin manifest test runs Claude Code's own validator, and refuses to
      # skip when SDDX_REQUIRE_CLAUDE is set
      - run: npm install -g @anthropic-ai/claude-code@2.1.311
      - run: bun test
        env:
          SDDX_REQUIRE_CLAUDE: "1"
      # openspec/ is private planning state and never committed, so this skips
      # explicitly here; it enforces scenario-to-test links in local checkouts.
      - run: bun run spec-coverage

  package-smoke:
    # Proves the artifact users actually get: pack it, install it somewhere
    # else entirely, and run a goal end to end with it. A green unit suite says
    # nothing about whether the tarball is complete.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: pack and install into a clean prefix
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/global"
          npm install --prefix "$RUNNER_TEMP/global" --global "$PWD/$tarball"
          echo "$RUNNER_TEMP/global/bin" >> "$GITHUB_PATH"
      - name: drive one goal through the whole lifecycle with the installed package
        run: sh scripts/smoke.sh

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Offline: only intra-repo links are checked, keeping CI network-independent.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md 'docs/**/*.md' 'examples/**/*.md'
          fail: true
